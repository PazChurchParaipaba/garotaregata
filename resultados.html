<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Garota Popularidade 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logoregata.png">
</head>

<body>
    <div class="voting-container">
        <header>
            <img src="logo.png" alt="34ª Regata de Lagoinha" class="logo">
            <h1>Resultados Gerais</h1>
            <p>Acompanhe em tempo real a quantidade de votos de cada candidata.</p>
        </header>

        <div id="loadingMessage" class="loading-message">Calculando votos...</div>
        <div id="errorMessage" class="error-message hidden">Erro ao carregar resultados. Tente novamente mais tarde.</div>

        <div id="candidatesGrid" class="candidates-grid hidden">
            <!-- Candidatas serão inseridas aqui via JavaScript -->
        </div>
        
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" class="cancel-btn" style="text-decoration: none; padding: 12px 25px; border-radius: 8px;">Voltar ao Início</a>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="resultados.js"></script>
</body>

</html>
